<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>多功能调音器</title>
<style>
  :root {
    --bg: #12121F;
    --surface: #1C1C31;
    --surface-2: #262640;
    --on-surface: #E6E6EE;
    --muted: #A9A9C0;
    --placeholder: #55556E;
    --tick: #6A6A8A;
    --tick-label: #8B8BA8;
    --green: #4CAF50;
    --red: #E53935;
    --blue: #1E88E5;
    --amber: #F2B134;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--on-surface);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  }
  body { overflow: hidden; }

  .app {
    /* 用 svh（不含手机浏览器上/下工具栏的最小视口）保证一屏内不裁到底部按钮，
       dvh/vh 作为低版本浏览器兜底 */
    height: 100vh;
    height: 100svh;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: clamp(8px, 2vh, 16px) 16px clamp(8px, 2vh, 14px);
    gap: clamp(6px, 1.6vh, 12px);
  }

  /* 三段式：顶部固定 / 中部自适应(内部滚动) / 底部固定 */
  .top { display: flex; flex-direction: column; gap: clamp(6px, 1.4vh, 12px); flex: none; min-height: 0; }
  .stage {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; align-items: center; padding: 2px 0;
  }
  .stage > .main { margin: auto 0; }
  .foot { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none; }

  .title { font-size: clamp(20px, 5vw, 26px); font-weight: 700; color: var(--on-surface); letter-spacing: 2px; }

  /* 顶栏：乐器选择 + A4参考 */
  .controls {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
  }
  .control-pill {
    background: var(--surface);
    border: 1px solid #38385A;
    border-radius: 999px;
    color: var(--muted);
    font-size: 14px;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
  }
  select.control-pill { cursor: pointer; }
  .control-pill label small { color: var(--tick-label); font-size: 12px; }
  .a4-input {
    width: 58px; background: transparent; border: none; border-bottom: 1px solid var(--tick);
    color: var(--on-surface); font-size: 14px; text-align: center; font-family: inherit;
    -moz-appearance: textfield;
  }
  .a4-input::-webkit-outer-spin-button, .a4-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* 稳定性滑块 */
  .stab {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .stab input[type=range] { flex: 1; }
  .stab .lbl { white-space: nowrap; width: 56px; text-align: center; font-size: 13px; color: var(--tick-label); }

  /* 琴弦显示：右侧固定 4 格窗口 + 左侧屏外排队区（一个横向滚动容器）。
     自动模式下 4 格=最近听到的弦（改进 LRU：新音挤占"最久没响"的位置，
     被挤掉的移到左侧屏外排队，可左右滑动找回，排队非空时左侧显示 ◀ 提示）。
     弦数≤4 的乐器：窗口直接显示全部弦，永远没有排队/滑动/◀，极简。 */
  .slotrow { width: 100%; display: flex; align-items: stretch; gap: 8px; position: relative; }
  .scroll-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: stretch;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .scroll-wrap::-webkit-scrollbar { display: none; height: 0; }
  .queue-area {
    flex: none;
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding-left: 2px;
    min-height: 46px;
  }
  .slot-window {
    flex: 0 0 100%;
    min-width: 0;
    display: flex;
    flex-wrap: nowrap;
    align-items: stretch;
    gap: 6px;
    min-height: 46px;
  }
  .slot {
    flex: 1 1 0;
    min-width: 0;
    background: var(--surface);
    border: 1.5px solid #38385A;
    color: var(--muted);
    border-radius: 12px;
    padding: 9px 2px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all .15s;
    touch-action: manipulation;
  }
  .slot.queued { flex: none; width: 64px; opacity: .8; }
  .slot.active {
    border-color: var(--green);
    color: var(--green);
    background: rgba(76,175,80,.12);
  }
  /* 手指点按的瞬时反馈：琥珀色闪光，约 0.6s 自动恢复（区别于"响过保持"的绿灯） */
  .slot.flash {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(242,177,52,.18);
  }
  /* 有排队时给左端让出 14px 窄条，放下面极小 ◀ 三角（不压任何键位） */
  .scroll-wrap.w-queue { padding-left: 14px; }
  /* 左侧排队提示：屏外有按钮时显示极小 ◀（纯提示，不挡点击） */
  .hint-left {
    position: absolute;
    left: 1px;
    top: 50%;
    transform: translateY(-50%);
    width: 13px;
    height: 16px;
    color: var(--tick-label);
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 3;
    text-shadow: 0 0 4px rgba(0,0,0,.85);
  }
  .hint-left.on { display: flex; }

  /* 弦位右侧的分组下拉：选一组就会替换左侧 4 个弦位 */
  .group-sel {
    flex: none;
    width: 78px;
    align-self: stretch;
    background: var(--surface);
    border: 1.5px solid #38385A;
    color: var(--muted);
    border-radius: 12px;
    font-size: 12px;
    font-family: inherit;
    text-align: center;
    padding: 0 6px;
  }

  .main {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, 0.9vh, 7px);
  }

  .note-circle {
    width: clamp(78px, 22vh, 132px); height: clamp(78px, 22vh, 132px); border-radius: 50%;
    background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .note-text {
    font-size: clamp(30px, 11vh, 46px); font-weight: 700; line-height: 1;
    color: var(--placeholder);
  }
  .note-text.detected { color: var(--green); }
  .note-text.long { font-size: clamp(26px, 9vh, 38px); }
  .target-label { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 18px; }

  .freq-text { font-size: clamp(15px, 4vh, 18px); font-weight: 500; color: var(--muted); min-height: 19px; }

  .meter-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .meter {
    position: relative; width: 100%; max-width: 92%;
    height: clamp(64px, 14vh, 92px);
    border-radius: 12px; background: var(--surface); overflow: hidden;
  }
  .meter canvas { width: 100%; height: 100%; display: block; }
  .status-text { text-align: center; font-size: clamp(16px, 4vh, 17px); font-weight: 600; min-height: 24px; margin-top: clamp(2px, 1vh, 10px); }

  .btnrow { display: flex; gap: 14px; align-items: center; }
  .btn {
    border: none; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
    background: var(--green); transition: background .2s; touch-action: manipulation;
    border-radius: 999px; height: 56px; padding: 0 22px;
  }
  .btn.round { width: 68px; height: 68px; border-radius: 50%; padding: 0; font-size: 15px; }
  .btn.recording { background: var(--red); }
  .btn.accent { background: var(--amber); color: #241c01; }
  .btn:active { filter: brightness(1.15); }

  /* 顶栏：标题 + 使用说明总入口 */
  .titlebar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .manual-btn {
    border: 1px solid var(--amber); color: var(--amber); background: transparent;
    font-size: 14px; font-weight: 600; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-family: inherit;
  }
  .manual-btn:active { background: rgba(242,177,52,.15); }

  /* 小问号按钮 */
  .help {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; flex: none; margin-left: 6px;
    border: 1.5px solid var(--tick-label); color: var(--tick-label); background: none;
    border-radius: 50%; font-size: 13px; line-height: 1; cursor: pointer; font-family: inherit; padding: 0;
  }
  .help:active { background: rgba(255,255,255,.12); }

  .ctrl-group { display: inline-flex; align-items: center; }
  .strings-head { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }

  /* 说明弹窗（奶白底大字） */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: #FFFBF2; color: #32291a; border-radius: 16px; width: 100%; max-width: 520px;
    max-height: 84dvh; display: flex; flex-direction: column; box-shadow: 0 12px 44px rgba(0,0,0,.45);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #e6e0d2; gap: 10px; }
  .modal-title { font-size: 22px; font-weight: 700; color: #1c1205; line-height: 1.3; }
  .modal-close {
    width: 46px; height: 46px; flex: none; border: none; background: #f0e9d8; color: #4a3f2a;
    border-radius: 50%; font-size: 26px; cursor: pointer; line-height: 1;
  }
  .modal-body { padding: 18px 20px 6px; overflow-y: auto; font-size: 19px; line-height: 1.75; color: #32291a; }
  .modal-body p { margin: 0 0 14px; }
  .modal-body h3 { font-size: 21px; margin: 6px 0 10px; color: #1c1205; }
  .modal-body ul { margin: 0 0 14px; padding-left: 24px; }
  .modal-body li { margin-bottom: 9px; }
  .modal-body .hl { background: #f3ecd9; padding: 2px 7px; border-radius: 6px; font-weight: 700; }
  .modal-body .warn { color: #b3541e; font-weight: 700; }
  .modal-foot { padding: 12px 20px 20px; display: flex; justify-content: center; }
  .modal-ok { border: none; background: #4CAF50; color: #fff; font-size: 20px; font-weight: 700; padding: 14px 40px; border-radius: 999px; cursor: pointer; }
</style>
</head>
<body>
  <div class="app">
    <div class="top">
    <div class="titlebar">
      <div class="title">多功能调音器</div>
      <button class="manual-btn" data-help="intro">📖 使用说明</button>
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <select id="presetSel" class="control-pill"></select>
        <button class="help" data-help="preset" aria-label="乐器选择说明">?</button>
      </div>
      <div class="ctrl-group">
        <label class="control-pill">A4<small>基准</small>
          <input id="a4Input" class="a4-input" type="number" value="440" min="415" max="466" step="1" inputmode="decimal">
          <small>Hz</small>
        </label>
        <button class="help" data-help="a4" aria-label="A4基准说明">?</button>
      </div>
    </div>

    <div class="stab">
      <span>灵敏</span>
      <input id="stabRange" type="range" min="0" max="100" value="50">
      <span>稳定</span>
      <span class="lbl" id="stabVal">适中</span>
      <button class="help" data-help="stability" aria-label="灵敏度说明">?</button>
    </div>

    <div class="slotrow">
      <div class="scroll-wrap" id="scrollWrap">
        <div class="queue-area" id="queueArea"></div>
        <div class="slot-window" id="stringsRow"></div>
      </div>
      <span class="hint-left" id="hintLeft" aria-hidden="true">◀</span>
      <select id="groupSel" class="group-sel" aria-label="选择琴弦组"></select>
    </div>
    </div><!-- /top -->

    <div class="stage">
    <div class="main">
      <div class="note-circle">
        <div id="noteText" class="note-text">--</div>
        <div id="targetLabel" class="target-label"></div>
      </div>

      <div id="freqText" class="freq-text"></div>

      <div class="ctrl-group" style="width:100%;">
        <div class="meter-wrap" style="flex:1;">
          <div class="meter"><canvas id="meter"></canvas></div>
          <div id="statusText" class="status-text"></div>
        </div>
        <button class="help" data-help="meter" aria-label="表盘说明">?</button>
      </div>
    </div>
    </div><!-- /stage -->

    <div class="foot">
    <div class="btnrow">
      <button id="recordBtn" class="btn round">开始</button>
      <button class="help" data-help="record" aria-label="开始说明">?</button>
    </div>
    </div><!-- /foot -->
  </div>

  <!-- 说明弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">说明</div>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot"><button class="modal-ok" id="modalOk">我知道了</button></div>
    </div>
  </div>

<script>
"use strict";

/* ======================== 基础常量 ======================== */
const MIN_FREQUENCY = 40;   // 覆盖贝斯 E1(41.2Hz)、大阮最低弦
const MAX_FREQUENCY = 2100;
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

/* ======================== 乐器调弦预设 ======================== */
// strings: 从低到高排列，note 使用科学音调记号（C4=中央C）
const PRESETS = [
  { id: "chromatic",  name: "半音阶 · 通用", strings: [] },
  { id: "zhongruan",  name: "中阮 · G D G D", strings: [
      { label: "4弦 G2", note: "G2" }, { label: "3弦 D3", note: "D3" },
      { label: "2弦 G3", note: "G3" }, { label: "1弦 D4", note: "D4" } ] },
  { id: "daruan",     name: "大阮 · D A D A", strings: [
      { label: "4弦 D2", note: "D2" }, { label: "3弦 A2", note: "A2" },
      { label: "2弦 D3", note: "D3" }, { label: "1弦 A3", note: "A3" } ] },
  { id: "xiaoruan",   name: "小阮 · D A D A", strings: [
      { label: "4弦 D3", note: "D3" }, { label: "3弦 A3", note: "A3" },
      { label: "2弦 D4", note: "D4" }, { label: "1弦 A4", note: "A4" } ] },
  { id: "guitar",     name: "吉他 · E A D G B E", strings: [
      { label: "6弦 E2", note: "E2" }, { label: "5弦 A2", note: "A2" },
      { label: "4弦 D3", note: "D3" }, { label: "3弦 G3", note: "G3" },
      { label: "2弦 B3", note: "B3" }, { label: "1弦 E4", note: "E4" } ] },
  { id: "bass",       name: "贝斯 · E A D G", strings: [
      { label: "4弦 E1", note: "E1" }, { label: "3弦 A1", note: "A1" },
      { label: "2弦 D2", note: "D2" }, { label: "1弦 G2", note: "G2" } ] },
  { id: "ukulele",    name: "尤克里里 · g c' e' a'", strings: [
      { label: "4弦 G4", note: "G4" }, { label: "3弦 C4", note: "C4" },
      { label: "2弦 E4", note: "E4" }, { label: "1弦 A4", note: "A4" } ] },
  { id: "violin",     name: "小提琴 · G D A E", strings: [
      { label: "4弦 G3", note: "G3" }, { label: "3弦 D4", note: "D4" },
      { label: "2弦 A4", note: "A4" }, { label: "1弦 E5", note: "E5" } ] },
  { id: "viola",      name: "中提琴 · C G D A", strings: [
      { label: "4弦 C3", note: "C3" }, { label: "3弦 G3", note: "G3" },
      { label: "2弦 D4", note: "D4" }, { label: "1弦 A4", note: "A4" } ] },
  { id: "cello",      name: "大提琴 · C G D A", strings: [
      { label: "4弦 C2", note: "C2" }, { label: "3弦 G2", note: "G2" },
      { label: "2弦 D3", note: "D3" }, { label: "1弦 A3", note: "A3" } ] },
  { id: "erhu",       name: "二胡 · D A", strings: [
      { label: "内弦 D4", note: "D4" }, { label: "外弦 A4", note: "A4" } ] },
  { id: "zheng",      name: "古筝 · 21弦 D调", strings: [
      { label: "21弦 D2", note: "D2" }, { label: "20弦 E2", note: "E2" },
      { label: "19弦 G2", note: "G2" }, { label: "18弦 A2", note: "A2" },
      { label: "17弦 B2", note: "B2" }, { label: "16弦 D3", note: "D3" },
      { label: "15弦 E3", note: "E3" }, { label: "14弦 G3", note: "G3" },
      { label: "13弦 A3", note: "A3" }, { label: "12弦 B3", note: "B3" },
      { label: "11弦 D4", note: "D4" }, { label: "10弦 E4", note: "E4" },
      { label: "9弦 G4", note: "G4" }, { label: "8弦 A4", note: "A4" },
      { label: "7弦 B4", note: "B4" }, { label: "6弦 D5", note: "D5" },
      { label: "5弦 E5", note: "E5" }, { label: "4弦 G5", note: "G5" },
      { label: "3弦 A5", note: "A5" }, { label: "2弦 B5", note: "B5" },
      { label: "1弦 D6", note: "D6" } ] },
  { id: "pipa",       name: "琵琶 · A D E a", strings: [
      { label: "4弦 A2", note: "A2" }, { label: "3弦 D3", note: "D3" },
      { label: "2弦 E3", note: "E3" }, { label: "1弦 A3", note: "A3" } ] },
  { id: "liuqin",     name: "柳琴 · g d1 g1 d2", strings: [
      { label: "4弦 G3", note: "G3" }, { label: "3弦 D4", note: "D4" },
      { label: "2弦 G4", note: "G4" }, { label: "1弦 D5", note: "D5" } ] }
];

/* ======================== 音名 / 频率换算 ======================== */
function noteIdx(name) {
  const m = /^([A-G])(#?)(-?\d)$/.exec(name);
  if (!m) return null;
  return { idx: NOTE_NAMES.indexOf(m[1] + (m[2] || "")), oct: parseInt(m[3], 10) };
}
function noteToMidi(name) { const p = noteIdx(name); return (p.oct + 1) * 12 + p.idx; }
function noteToFreq(name, a4) { return a4 * Math.pow(2, (noteToMidi(name) - 69) / 12); }
function midiToNote(midi) {
  const r = Math.round(midi);
  const idx = ((r % 12) + 12) % 12;
  return NOTE_NAMES[idx] + (Math.floor(r / 12) - 1);
}

/* ======================== YIN 音高检测 ======================== */
function detectFrequency(samples, sampleRate) {
  const n = samples.length;
  const maxLag = Math.floor(sampleRate / MIN_FREQUENCY);
  const minLag = Math.floor(sampleRate / MAX_FREQUENCY);
  if (maxLag >= n) return 0;

  const d = new Float64Array(maxLag + 2);
  for (let tau = 0; tau <= maxLag; tau++) {
    let sum = 0; const m = n - tau;
    for (let i = 0; i < m; i++) { const df = samples[i] - samples[i + tau]; sum += df * df; }
    d[tau] = sum;
  }
  const cmndf = new Float64Array(maxLag + 1);
  cmndf[0] = 1;
  { let running = 0;
    for (let tau = 1; tau <= maxLag; tau++) { running += d[tau]; cmndf[tau] = running > 0 ? d[tau] * tau / running : 1; } }

  const threshold = 0.12;
  let bestTau = -1;
  for (let tau = minLag; tau <= maxLag; tau++) {
    if (cmndf[tau] < threshold) {
      while (tau + 1 <= maxLag && cmndf[tau + 1] < cmndf[tau]) tau++;
      bestTau = tau; break;
    }
  }
  if (bestTau < 0) {
    let minV = 2;
    for (let tau = minLag; tau <= maxLag; tau++) if (cmndf[tau] < minV) { minV = cmndf[tau]; bestTau = tau; }
    if (minV > 0.35) return 0;
  }
  let refined = bestTau;
  if (bestTau > minLag && bestTau < maxLag) {
    const a = cmndf[bestTau - 1], b = cmndf[bestTau], c = cmndf[bestTau + 1];
    const denom = a - 2 * b + c;
    if (Math.abs(denom) > 1e-12) { const delta = 0.5 * (a - c) / denom; if (delta > -1 && delta < 1) refined = bestTau + delta; }
  }
  return sampleRate / refined;
}

/* ======================== 状态：显示对象 + 保持/去抖 ======================== */
let a4ref = 440;
let presetId = "chromatic";
let disp = { detected: false };

// 目标弦：根据当前音高找最近的预设弦，返回 {index, note, freq}
function nearestString(freq) {
  const p = PRESETS.find(x => x.id === presetId);
  if (!p || !p.strings.length) return null;
  const fmidi = 69 + 12 * Math.log2(freq / a4ref);
  let bi = 0, bd = 1e9;
  for (let i = 0; i < p.strings.length; i++) {
    const tmidi = noteToMidi(p.strings[i].note);
    const dmidi = Math.abs(fmidi - tmidi);
    // 也容忍哨/微风噪声：在弦目标 .5 semitone 内才算命中
    if (dmidi < bd) { bd = dmidi; bi = i; }
  }
  const n = p.strings[bi].note;
  return { index: bi, note: n, freq: noteToFreq(n, a4ref) };
}

function computeDisplay(freq) {
  // 无预设字符串（半音阶）：最近十二平均律音符
  const st = nearestString(freq);
  if (!st) {
    const midi = 69 + 12 * Math.log2(freq / a4ref);
    const near = Math.round(midi);
    const cents = (midi - near) * 100;
    return { detected: true, freq, bigNote: midiToNote(near), target: null, ci: -1, cents };
  }
  // 有预设字符串：偏差相对最近的那根弦
  const cents = 1200 * Math.log2(freq / st.freq);
  return { detected: true, freq, bigNote: st.note, target: st.note, ci: st.index, cents };
}

// 稳定性参数（由滑块得出）
let stability = 50;
function confirmFrames() { return stability < 20 ? 1 : stability < 60 ? 2 : stability < 85 ? 3 : 4; }

// 去抖状态机
let pending = null, pendingN = 0;

function keyOf(freq) {
  const st = nearestString(freq);
  return st ? "s" + st.index : "n" + midiToNote(69 + 12 * Math.log2(freq / a4ref));
}

/* ======================== 界面元素 ======================== */
const noteEl = document.getElementById("noteText");
const targetEl = document.getElementById("targetLabel");
const freqEl = document.getElementById("freqText");
const statusEl = document.getElementById("statusText");
const recordBtn = document.getElementById("recordBtn");
const presetSel = document.getElementById("presetSel");
const groupSel = document.getElementById("groupSel");
const a4Input = document.getElementById("a4Input");
const stabRange = document.getElementById("stabRange");
const stabVal = document.getElementById("stabVal");
const stringsRow = document.getElementById("stringsRow");
const queueArea = document.getElementById("queueArea");
const hintLeft = document.getElementById("hintLeft");
const scrollWrap = document.getElementById("scrollWrap");
// 自动回滚到右侧 4 格（屏外排队按钮在左侧隐藏）
function snapRight() { try { scrollWrap.scrollLeft = scrollWrap.scrollWidth; } catch (_) {} }
function hideQueue() { queueArea.innerHTML = ""; hintLeft.classList.remove("on"); scrollWrap.classList.remove("w-queue"); }
const meterCanvas = document.getElementById("meter");
const meterCtx = meterCanvas.getContext("2d");
let meterDPR = 1;

/* ======================== 琴弦显示：自动(LRU) / 手动(选组) 两种模式 ======================== */
//  自动模式(auto)：麦克风收音，右侧 4 格=最近听到的弦（改进 LRU：新音挤占"最久没响"的位置，
//    被挤掉的移到左侧屏外排队，可左右滑动找回，排队非空时显示 ◀；弦数≤4 直接显示全部弦）。
//  手动模式(manual)：闭麦，通过右侧下拉选一组，4 格固定显示这组的弦，点哪根播哪根。
//  「开始/停止」大圆按钮在两种模式间切换：选组=自动切到停止状态（按钮变绿「开始」），
//    点「开始」=回自动模式，保留刚才显示的 4 个音并清空排队历史。
let mode = "manual";          // "auto" | "manual"
let windowEntries = [];       // [{ index: 弦序号, lastSeq: 最近听到序号 }] —— 屏内 4 格内容（最多 4 项）
let queueEntries = [];        // [index, ...] 被挤掉的弦，按被挤出先后从左到右排队（屏外隐藏）
let winSeq = 0;
let slotCells = [];
let groupList = [];           // [{ label, indices }] 当前乐器的分组（每4个一组）
let suppressUntil = 0;        // 用户手势滑动期间，暂停自动回滚（2 秒）

function slotCount() {
  const p = PRESETS.find(x => x.id === presetId);
  return p && p.strings.length ? Math.min(4, p.strings.length) : 0;
}

// 重建 4 格（或弦数≤4 时全部弦的窗口）。启动 / 换乐器时调用：
//   - 弦数≤4 的乐器：直接把全部弦显示出来（极简，不会出现排队/滑动/◀）；
//   - 弦数>4 的乐器（古筝/吉他）：先放最靠前 4 根（B 方案），之后由挤占规则替换内容。
// 所以槽位不再是空的 "--"，而是预填"当前应显示的弦"。
function buildSlots() {
  windowEntries = []; queueEntries = []; winSeq = 0;
  stringsRow.innerHTML = ""; slotCells = [];
  const cap = slotCount();
  if (cap === 0) { stringsRow.style.display = "none"; hideQueue(); return; }
  stringsRow.style.display = "flex";
  for (let i = 0; i < cap; i++) {
    windowEntries.push({ index: i, lastSeq: ++winSeq });
    const cell = document.createElement("button");
    cell.className = "slot";
    stringsRow.appendChild(cell);
    slotCells.push(cell);
  }
  syncSlots(-1);
}

// 手动模式：把某组的弦写进"屏内 4 格内容"，点哪根播哪根。槽位 DOM 固定不销毁，只换内容。
// 选组即"手动选择了这 4 个音"：它们成为新的窗口内容（时间戳全新），排队历史清空。
function showGroup(indices) {
  const p = PRESETS.find(x => x.id === presetId);
  if (!p || !indices.length) { stringsRow.style.display = "none"; hideQueue(); return; }
  stringsRow.style.display = "flex";
  windowEntries = indices.map(ci => ({ index: ci, lastSeq: ++winSeq }));
  queueEntries = [];
  hideQueue();
  syncSlots(-1);
}

// 构造右侧分组下拉：第一项"自动跟随"，其后每 4 根一组。
function buildGroupOptions() {
  const p = PRESETS.find(x => x.id === presetId);
  groupList = [];
  groupSel.innerHTML = "";
  const autoOpt = document.createElement("option");
  autoOpt.value = "auto"; autoOpt.textContent = "▶ 自动";
  groupSel.appendChild(autoOpt);
  if (p && p.strings.length) {
    for (let s = 0; s < p.strings.length; s += 4) {
      const chunk = p.strings.slice(s, s + 4);
      const notes = chunk.map(x => x.note).join(" ");
      const indices = chunk.map((_, i) => s + i);
      const gid = groupList.length;
      const opt = document.createElement("option");
      opt.value = "g" + gid;
      opt.textContent = "第" + (gid + 1) + "组 · " + notes;
      groupSel.appendChild(opt);
      groupList.push({ label: notes, indices });
    }
  }
  groupSel.value = "auto";
}

// 进入手动模式（闭麦）：显示某组弦。gid 形如 "g0"、"g1"。
// freeze=true（点「停止」触发）：不动内容，原样冻结当前 4 格（点格可听参照音），仅清掉排队历史。
function enterManual(gid, freeze) {
  mode = "manual";
  if (freeze) {
    queueEntries = []; hideQueue();
    groupSel.value = "auto";       // 停止=暂停自动，仍处于「自动」轨道
    clearDisplay();
    return;
  }
  const gi = parseInt(gid.replace("g", ""), 10);
  if (!isNaN(gi) && groupList[gi]) {
    showGroup(groupList[gi].indices);
    groupSel.value = gid;
  } else if (groupList.length) {
    showGroup(groupList[0].indices);
    groupSel.value = "g0";
  } else {
    showGroup([]);
  }
  clearDisplay();
}

// 进入自动模式（开麦）：不重建槽位——保留"刚才显示的 4 个音"作为初始内容，
// 清空排队历史，滚回右侧 4 格，然后开始收音；后续由挤占规则替换。
function enterAuto() {
  mode = "auto";
  groupSel.value = "auto";
  queueEntries = []; hideQueue();
  snapRight();
  clearDisplay();
  startRecording();
}

// 检测到某根弦：更新"屏内 4 格 + 左侧排队"（改进 LRU）：
//   - 已在屏内：位置不动，只刷新为"最新响过"（连续调同一根弦不会换座位）；
//   - 屏外排队中的音响起：先离开队列；
//   - 屏内没它 → 挤占"最久没响"的那格（该格内容换成它、时间戳最新），被挤掉的进左侧排队。
function touchString(ci) {
  const cap = slotCount();
  if (cap === 0 || ci < 0 || mode !== "auto") return false;
  const found = windowEntries.find(e => e.index === ci);
  if (found) { found.lastSeq = ++winSeq; return false; }
  const qidx = queueEntries.indexOf(ci);
  if (qidx >= 0) queueEntries.splice(qidx, 1);
  if (windowEntries.length < cap) {                    // 还有空格（如手动恢复后不足4音）：先填空
    windowEntries.push({ index: ci, lastSeq: ++winSeq });
  } else {
    let min = 0;                                        // 找最久没响的格
    for (let i = 1; i < windowEntries.length; i++)
      if (windowEntries[i].lastSeq < windowEntries[min].lastSeq) min = i;
    const evictedIndex = windowEntries[min].index;
    windowEntries[min] = { index: ci, lastSeq: ++winSeq };
    if (queueEntries.indexOf(evictedIndex) < 0) queueEntries.push(evictedIndex);
  }
  return true;
}

// 把"屏内 4 格"画到格子上，并同步左侧排队按钮与 ◀ 提示。
// currentCi 是当前正被检测到的弦（绿色高亮）。
// 排队按钮只播放参照音（不改变槽位）；只有它再被麦克风检测到，才由 touchString 挤回屏内。
function syncSlots(currentCi) {
  const p = PRESETS.find(x => x.id === presetId);
  const n = p ? p.strings.length : 0;
  for (let i = 0; i < slotCells.length; i++) {
    const cell = slotCells[i];
    const e = i < windowEntries.length ? windowEntries[i] : null;
    // 越界保护：索引超出当前乐器的弦数时按空格显示，任何状态下都不抛异常
    if (e && e.index < p.strings.length) {
      const s = p.strings[e.index];
      cell.textContent = s.label;
      cell.onclick = () => { flashBtn(cell); playTone(noteToFreq(s.note, a4ref)); };
      cell.classList.toggle("active", e.index === currentCi);
    } else {
      cell.textContent = "--";
      cell.onclick = null;
      cell.classList.remove("active");
    }
  }
  // 左侧屏外排队区；弦数≤4 时队列恒为空
  queueArea.innerHTML = "";
  for (const qi of queueEntries) {
    if (qi >= p.strings.length) continue;   // 越界保护
    const s = p.strings[qi];
    const b = document.createElement("button");
    b.className = "slot queued";
    b.textContent = s.label;
    b.onclick = () => { flashBtn(b); playTone(noteToFreq(s.note, a4ref)); };
    queueArea.appendChild(b);
  }
  const hasQueue = queueEntries.length > 0 && n > 4;
  hintLeft.classList.toggle("on", hasQueue);
  scrollWrap.classList.toggle("w-queue", hasQueue);   // 有排队时左端让出窄条给箭头
  if (mode === "auto" && hasQueue && performance.now() > suppressUntil) snapRight();
}

// 手指点按键位的琥珀色瞬闪反馈，约 0.6s 自动恢复（"快速自动清屏"）
function flashBtn(el) {
  if (!el) return;
  el.classList.remove("flash");
  void el.offsetWidth;                      // 强制回流，连续点按也会重新闪
  el.classList.add("flash");
  clearTimeout(el._flashT);
  el._flashT = setTimeout(() => el.classList.remove("flash"), 600);
}

function render() {
  const d = disp;
  if (d.detected) {
    noteEl.textContent = d.bigNote;
    noteEl.classList.remove("long"); noteEl.classList.add("detected");
    if (d.bigNote.length > 2) noteEl.classList.add("long");
    targetEl.textContent = (d.target ? "目标 " + d.target : (d.ci >= 0 ? "自动定位弦" : ""));
    freqEl.textContent = d.freq.toFixed(1) + " Hz";

    const abs = Math.abs(d.cents);
    let txt, col;
    if (abs < 5) { txt = "准确"; col = "var(--green)"; }
    else if (d.cents > 0) { txt = "偏高 " + Math.round(d.cents) + "¢"; col = "var(--red)"; }
    else { txt = "偏低 " + Math.round(Math.abs(d.cents)) + "¢"; col = "var(--blue)"; }
    statusEl.textContent = txt; statusEl.style.color = col;
    touchString(d.ci);
    syncSlots(d.ci);
  } else {
    noteEl.textContent = "--";
    noteEl.classList.remove("detected", "long");
    targetEl.textContent = "";
    freqEl.textContent = "";
    statusEl.textContent = ""; statusEl.style.color = "";
    syncSlots(-1);
  }
  drawMeter(d.detected ? d.cents : 0, d.detected);
}

function clearDisplay() { disp = { detected: false }; render(); }

/* ======================== 调音表盘 ======================== */
function sizeMeter() {
  const rect = meterCanvas.getBoundingClientRect();
  meterDPR = window.devicePixelRatio || 1;
  meterCanvas.width = Math.max(1, Math.round(rect.width * meterDPR));
  meterCanvas.height = Math.max(1, Math.round(rect.height * meterDPR));
}

function drawMeter(cents, detected) {
  const W = meterCanvas.width, H = meterCanvas.height, ctx = meterCtx;
  ctx.clearRect(0, 0, W, H);
  const dpr = meterDPR;
  if (H < 10 * dpr) return;
  const pad = 16 * dpr;
  const centerX = W / 2;
  const meterWidth = W - 2 * pad;
  // 刻度区从顶部锚定，整体靠上放置，消除顶部空白
  const tickTop = 4 * dpr;                       // 主刻度顶端
  const majorHalf = H * 0.30;                    // 主刻度半高
  const minorHalf = H * 0.21;                    // 次刻度半高
  const midY = tickTop + majorHalf;              // 中心线 y
  const zoneHalf = H * 0.22;                     // 绿色区半高
  const needleHalf = H * 0.28;                   // 中心线/指针半长
  const dotR = Math.max(6, H * 0.085);           // 指针圆点
  const numY = H - 5 * dpr;                      // 底部音分数基线
  const numFont = Math.max(11, H * 0.14);        // 音分数(调大一点)

  // 背景刻度（-50..+50，每 5¢ 一格）
  const tickCount = 20;
  for (let i = 0; i <= tickCount; i++) {
    const x = pad + (meterWidth * i / tickCount);
    const isMajor = i % 5 === 0;
    ctx.strokeStyle = getCss("--tick");
    ctx.lineWidth = (isMajor ? 2 : 1) * dpr;
    ctx.beginPath();
    const top = midY - (isMajor ? majorHalf : minorHalf);
    const bot = midY + (isMajor ? majorHalf : minorHalf);
    ctx.moveTo(x, top); ctx.lineTo(x, bot); ctx.stroke();
    if (isMajor) {
      const cv = (i - 10) * 5;
      ctx.fillStyle = getCss("--tick-label");
      ctx.font = numFont + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(cv, x, numY);
    }
  }

  // 中心绿色 ±5¢
  const gStart = centerX - meterWidth * 0.05, gEnd = centerX + meterWidth * 0.05;
  ctx.fillStyle = getCss("--green") + "55";
  ctx.fillRect(gStart, midY - zoneHalf, gEnd - gStart, zoneHalf * 2);

  // 中心线
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2 * dpr;
  ctx.beginPath(); ctx.moveTo(centerX, midY - needleHalf); ctx.lineTo(centerX, midY + needleHalf); ctx.stroke();

  // 指针
  if (detected) {
    const clamped = Math.max(-50, Math.min(50, cents));
    const px = centerX + (clamped / 50) * (meterWidth / 2);
    let pc = getCss("--green");
    if (Math.abs(clamped) >= 5) pc = clamped > 0 ? getCss("--red") : getCss("--blue");
    ctx.fillStyle = pc;
    ctx.beginPath();
    ctx.moveTo(px, midY - needleHalf);
    ctx.lineTo(px - dotR * 0.8, midY - needleHalf * 0.6);
    ctx.lineTo(px + dotR * 0.8, midY - needleHalf * 0.6);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(px, midY + needleHalf * 0.55, dotR, 0, Math.PI * 2); ctx.fill();
  }
}

function getCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ======================== 音频录制 ======================== */
let audioCtx = null, audioStream = null, processor = null, source = null, isRecording = false;

async function startRecording() {
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    statusEl.textContent = "无法访问麦克风，请检查权限"; statusEl.style.color = "var(--red)";
    return;
  }
  const FC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new FC({ sampleRate: 44100 });
  source = audioCtx.createMediaStreamSource(audioStream);

  const bufSize = 4096; // 更大的缓冲以支持更低的基频(40Hz)
  processor = audioCtx.createScriptProcessor(bufSize, 1, 1);
  const sampleRate = audioCtx.sampleRate;

  // 静噪门阈值（相对 RMS），低于此视为安静
  const rmsGate = 0.006;

  processor.onaudioprocess = (e) => {
    const ch = e.inputBuffer.getChannelData(0);

    // RMS 静噪门：先算响度
    let sum = 0;
    for (let i = 0; i < ch.length; i++) sum += ch[i] * ch[i];
    const rms = Math.sqrt(sum / ch.length);

    if (rms < rmsGate) {
      // 安静：不清屏——保留最后一个响过的音符/表盘指针/键位绿色高亮，
      // 方便看着表盘慢慢对准；只有手动模式/切乐器时才会清掉
      return;
    }

    const freq = detectFrequency(ch, sampleRate);
    if (freq >= MIN_FREQUENCY && freq <= MAX_FREQUENCY * 1.02) {
      const k = keyOf(freq);
      if (pending && pending.k === k) pending.n++;
      else { pending = { k, freq }; pending.n = 1; }
      if (pending.n >= confirmFrames()) {
        disp = computeDisplay(freq);
        pending = null;
        render();
      }
    }
  };

  source.connect(processor);
  try { processor.connect(audioCtx.destination); } catch (_) {}
  isRecording = true;
  recordBtn.textContent = "停止";
  recordBtn.classList.add("recording");
}

function stopRecording() {
  if (processor) { try { processor.disconnect(); } catch(_){} processor = null; }
  if (source) { try { source.disconnect(); } catch(_){} source = null; }
  if (audioStream) { audioStream.getTracks().forEach(t => t.stop()); audioStream = null; }
  if (audioCtx) { try { audioCtx.close(); } catch(_){} audioCtx = null; }
  isRecording = false;
  recordBtn.textContent = "开始";
  recordBtn.classList.remove("recording");
  pending = null; pendingN = 0;
  // 注意：这里【不要】clearDisplay()！切乐器时会先改 presetId 再调 stopRecording，
  // 若在此刷新界面，会出现"新乐器的数据 + 旧乐器槽位"的混合渲染导致越界异常、
  // 中断后续重建。清屏统一交给调用方（切乐器/进手动模式）在重建完成后再做。
}

/* ======================== 开始/停止：在 自动(收音) 与 手动(选组) 模式间切换 ======================== */
recordBtn.addEventListener("click", () => {
  if (isRecording) {
    stopRecording();              // 关麦 -> 手动模式：冻结当前 4 格（排队历史清空），点格可听参照音
    enterManual(null, true);
  } else {
    enterAuto();                  // 开麦 -> 自动模式：从当前显示的 4 个音继续，清空排队历史
  }
});

/* ======================== 发声器：模拟真实弦乐（零采样，纯算法） ======================== */
// 拨弦类（古筝/阮/琵琶/柳琴/吉他/尤克里里/贝斯）：Karplus-Strong 算法，
//   用"延迟线+低通+衰减"物理模拟弦振动，天然带拨弦音头与衰减，接近真实拨弦声。
// 拉弦/持续类（提琴/二胡/半音阶）：升级版加法合成（多泛音+颤音+持续包络），
//   模拟弓毛长时间摩擦弦的声音。
// 两者都不依赖任何音频采样文件，页面体积几乎不增加。
const PLUCK_IDS = new Set(["zhongruan","daruan","xiaoruan","guitar","bass","ukulele","zheng","pipa","liuqin"]);
let toneCtx = null, toneSources = [], toneTimer = null;

function stopTone() {
  toneSources.forEach(s => { try { s.stop(); } catch (_) {} });
  toneSources = [];
  if (toneTimer) { clearTimeout(toneTimer); toneTimer = null; }
  if (toneCtx) { try { toneCtx.close(); } catch (_) {} toneCtx = null; }
}

function newToneCtx() {
  try { toneCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
  if (toneCtx.state === "suspended") { try { toneCtx.resume(); } catch (_) {} }
  return true;
}

function playTone(freq) {
  const p = PRESETS.find(x => x.id === presetId);
  const usePluck = p && PLUCK_IDS.has(p.id);
  stopTone();
  if (!newToneCtx()) return;
  try { if (usePluck) ksPlay(freq); else bowPlay(freq); } catch (e) {}
}

// ---------- Karplus-Strong：预生成拨弦采样波形，再播放。无需实时处理节点 ----------
function ksPlay(freq) {
  const sr = toneCtx.sampleRate || 44100;
  const dur = 1.5, total = Math.floor(sr * dur);
  const N = Math.max(2, Math.round(sr / freq));      // 一个周期的延迟线长度
  const out = new Float32Array(total);
  const ring = new Float32Array(N);
  // 德尔塔式激振：充满随即波形的环形缓冲 = "拨"的一下
  for (let i = 0; i < N; i++) ring[i] = (Math.random() * 2 - 1) * 0.55;
  // 低音弦衰减慢（振得久），高音弦衰减略快
  const decay = Math.min(0.9992, 0.996 + 0.008 * (130 / freq));
  for (let i = 0; i < total; i++) {
    const idx = i % N;
    const s = ring[idx];
    out[i] = s;
    // 相邻两点平均=低通，抹平高频噪声，使音色随时间变暗（真实拨弦感）
    const avg = 0.5 * (ring[idx] + ring[(idx + 1) % N]);
    ring[idx] = avg * decay;
  }
  const buffer = toneCtx.createBuffer(1, total, sr);
  buffer.copyToChannel(out, 0);
  const src = toneCtx.createBufferSource();
  src.buffer = buffer;
  const gain = toneCtx.createGain();
  gain.gain.value = 0.55;
  src.connect(gain); gain.connect(toneCtx.destination);
  src.start();
  toneSources.push(src);
  toneTimer = setTimeout(stopTone, 1600);
}

// ---------- 拉弦/持续类：多泛音 + 轻微颤音 + 起奏/持续/释音包络 ----------
function bowPlay(freq) {
  const t = toneCtx.currentTime;
  const master = toneCtx.createGain();
  master.gain.value = 0.24;
  master.connect(toneCtx.destination);
  const partials = [[1, 1.0], [2, 0.40], [3, 0.24], [4, 0.14], [5, 0.08]];
  const lfo = toneCtx.createOscillator();      // 弓弦的轻微颤音
  lfo.frequency.value = 5;
  const lfoGain = toneCtx.createGain();
  lfoGain.gain.value = freq * 0.004;
  lfo.connect(lfoGain);
  partials.forEach(([r, a]) => {
    const o = toneCtx.createOscillator();
    o.type = "sine"; o.frequency.value = freq * r;
    if (r === 1) lfoGain.connect(o.frequency);   // 颤音只加在基波
    const g = toneCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(a * 0.32, t + 0.03);  // 弓触弦起奏
    g.gain.setValueAtTime(a * 0.32, t + 0.6);                  // 持音
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);      // 释音
    o.connect(g); g.connect(master);
    o.start(); o.stop(t + 1.3);
    toneSources.push(o);
  });
  lfo.start(); lfo.stop(t + 1.3);
  toneSources.push(lfo);
  toneTimer = setTimeout(stopTone, 1350);
}
window.addEventListener("keydown", (e) => { if (e.key === "Escape") stopTone(); });

/* ======================== 控件绑定 ======================== */
PRESETS.forEach(p => {
  const opt = document.createElement("option");
  opt.value = p.id; opt.textContent = p.name;
  presetSel.appendChild(opt);
});
presetSel.addEventListener("change", () => {
  presetId = presetSel.value;
  if (isRecording) stopRecording();
  buildGroupOptions();
  mode = "auto";
  buildSlots(); pending = null; clearDisplay();
});
presetSel.value = presetId;
buildGroupOptions();
mode = "auto";   // 初始即"自动跟随"：弦数≤4 直接显示全部弦；>4（古筝/吉他）先显示前 4 根
buildSlots();

// 手势滑动期间暂停自动回滚 2 秒：让"手动滑去左侧看排队按钮"时不被拉回右侧 4 格
scrollWrap.addEventListener("touchstart", () => { suppressUntil = performance.now() + 2000; }, { passive: true });
scrollWrap.addEventListener("touchmove",  () => { suppressUntil = performance.now() + 2000; }, { passive: true });

// 右侧分组下拉：选「自动」=回自动模式；选一组=进手动模式（闭麦，4 位换为这组，点哪根播哪根）。
groupSel.addEventListener("change", () => {
  const v = groupSel.value;
  if (v === "auto") {
    if (isRecording) { mode = "auto"; }
    else { enterAuto(); }
  } else {
    if (isRecording) stopRecording();   // 选组=自动切到停止状态（底部按钮变绿「开始」）
    enterManual(v);                     // 切到手动：4 格换成该组，排队历史清空
  }
});

a4Input.addEventListener("change", () => {
  const v = parseFloat(a4Input.value);
  if (isFinite(v) && v >= 400 && v <= 470) { a4ref = v; pending = null; if (!isRecording) clearDisplay(); render(); }
  else a4Input.value = String(a4ref);
});

stabRange.addEventListener("input", () => {
  stability = parseInt(stabRange.value, 10);
  stabVal.textContent = (stability < 20 ? "灵敏" : stability < 60 ? "适中" : stability < 85 ? "较稳" : "最稳");
});

}
